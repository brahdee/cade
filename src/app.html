<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        width: 100dvw;
        height: 100dvh;
        margin: 0;
      }

      div#container {
        margin-top: -30px;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      button,
      input {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
      }

      button {
        border-radius: 0;
        background-color: #ec6035;
        border: 2px solid rgb(206, 206, 206);
        padding: 10px;
        color: white;
      }

      button:hover {
        cursor: pointer;
        background-color: #f3804f;
      }

      button:disabled {
        cursor: default !important;
        opacity: 0.5;
      }

      input {
        height: 30px;
        width: auto;
      }

      #cade-block {
        display: flex;
        flex-direction: row;
        align-items: center;
        position: relative;
        gap: 20px;
        cursor: default;
      }

      #cade-block button {
        padding: 0;
        margin: 0;
        border: none;
        background: none;
        cursor: pointer;
      }

      #cade {
        width: 40px;
        height: 40px;
        vertical-align: middle;
        position: relative;
        image-rendering: pixelated;
      }

      #cade.jump {
        top: -30px !important;
      }

      .speech-bubble {
        position: relative;
        background: #f89266;
        width: 200px;
        padding: 10px 10px;
        text-align: center;
        color: white;
        border: 2px dotted rgb(255, 255, 255);
      }

      .speech-bubble:after {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        width: 0;
        height: 0;
        border: 12px solid transparent;
        border-right-color: #f89266;
        border-left: 0;
        border-bottom: 0;
        margin-top: -10px;
        margin-left: -11px;
      }

      #download-container {
        cursor: default;
      }
    </style>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
