<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        width: 100dvw;
        height: 100dvh;
        margin: 0;
      }

      div#container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      button,
      input {
        font-family: "Courier New", Courier, monospace;
        height: 30px;
      }

      input {
        width: 300px;
      }

      #cade {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 20px;
      }

      #cade img {
        width: 40px;
        height: 40px;
        vertical-align: middle;
      }

      .speech-bubble {
        position: relative;
        background: linear-gradient(90deg, #f99164 0%, #ffc4ab 100%);
        width: 200px;
        padding: 10px 10px;
        text-align: center;
        color: white;
      }

      .speech-bubble:after {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        width: 0;
        height: 0;
        border: 12px solid transparent;
        border-right-color: #f99164;
        border-left: 0;
        border-bottom: 0;
        margin-top: -10px;
        margin-left: -11px;
      }
    </style>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
