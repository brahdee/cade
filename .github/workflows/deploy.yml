
name: Deploy cade

on:
  push:
    branches:
      - rewrite
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cade-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set image prefix
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set Git metadata
        run: |
          {
            echo "GIT_COMMIT=$(git rev-parse --short HEAD)"
            echo "GIT_COMMIT_COUNT=$(git rev-list --count HEAD)"
            echo "GIT_TIMESTAMP=$(git log -1 --format=%ct)"
            printf 'GIT_MESSAGE=%s\n' "$(git log -1 --format=%s)"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bot
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true

          build-args: |
            GIT_COMMIT=${{ env.GIT_COMMIT }}
            GIT_COMMIT_COUNT=${{ env.GIT_COMMIT_COUNT }}
            GIT_TIMESTAMP=${{ env.GIT_TIMESTAMP }}
            GIT_MESSAGE=${{ env.GIT_MESSAGE }}

          tags: |
            ${{ env.IMAGE_PREFIX }}/bot:latest
            ${{ env.IMAGE_PREFIX }}/bot:${{ github.sha }}

          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.web
          target: production
          push: true

          tags: |
            ${{ env.IMAGE_PREFIX }}/web:latest
            ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}

          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Prepare SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Update production Compose file
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            compose.yaml \
            "$SERVER_USER@$SERVER_HOST:/opt/cade/compose.yaml"

      - name: Deploy production containers
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "cd /opt/cade &&
             IMAGE_TAG='${GITHUB_SHA}' docker compose pull bot web &&
             docker compose up -d --wait postgres &&
             IMAGE_TAG='${GITHUB_SHA}' docker compose run --rm --no-deps bot node dist/database/migrate.js &&
             IMAGE_TAG='${GITHUB_SHA}' docker compose up -d --no-build --remove-orphans &&
             docker image prune -f"
